[custom]
; 严格规则模式（墙外尽量代理，墙内/有中国业务的服务尽量直连）
; 1. 代理组默认不暴露 DIRECT，避免误选导致海外流量直连
; 2. AI / 开发平台 / 常见海外服务显式前置，优先于通用远程规则集
; 3. 微软 / 苹果这类存在中国区服务的厂商单独分组，默认直连优先
; 4. PROCESS-NAME 规则仅在支持该能力的客户端 / 模式下生效（如 Clash Meta TUN）

exclude_remarks=(Data Left|Remain:|Traffic:|Expir[ey]|Reset|(\d[\d.]*\s*[MG]B[^\dA-Za-z]+|[:：]\s*)\d[\d.]*\s*GB(?![\dA-Za-z])|剩[余餘]流量|流量：|[到过過效]期|[时時][间間]|重置|分割线|残り使用容量|残りデータ通信量|有効期限|リセット|🔰 (ID|HSD|SNI):|📝 Gói:)

add_emoji=true
remove_old_emoji=false

; ─────────────────────────────────────────────────────────────
; 顶层手动选择入口
; ─────────────────────────────────────────────────────────────
custom_proxy_group=🚀 起飞`select`[]⚡ 自动选择`[]🛟 故障转移`[]▶️ YouTube测速`[]🧰 GitHub测速`[]🤖 AI测速`[]🛟 AI故障转移`[]🌏 国家测速`[]🎛️ 指定`[]🇯🇵 日本`[]🇰🇷 韩国`[]🇹🇼 台湾`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇨🇳 中国`[]🌐 其他`[]🎛️🇯🇵 日本`[]🎛️🇰🇷 韩国`[]🎛️🇹🇼 台湾`[]🎛️🇸🇬 新加坡`[]🎛️🇺🇸 美国`[]🎛️🇨🇳 中国`[]🎛️🌐 其他`[]REJECT
custom_proxy_group=🎛️ 指定`select`^

custom_proxy_group=🏠 墙内`select`[]DIRECT`[]REJECT`[]🚀 起飞
custom_proxy_group=🧹 广告`select`[]REJECT`[]🏠 墙内`[]🚀 起飞

custom_proxy_group=📺 B站`select`[]🏠 墙内`[]🇨🇳 中国`[]🚀 起飞`[]🎛️🇨🇳 中国`[]🎛️ 指定

; AI 策略组
; - 自动档：AI测速 / AI故障转移 均直接对节点测速，测速 URL 为 chatgpt.com，路径最短
; - 手动档：🎛️ 国家组仅供强制指定某国节点时使用，不引入通用 url-test 国家组（避免用 YouTube/Google 质量代替 AI 连通性）
; - 不暴露通用 全局自动选择 / 故障转移 / 中国 / 起飞，防止间接走到 AI 不支持地区出口
custom_proxy_group=🤖 AI`select`[]🤖 AI测速`[]🛟 AI故障转移`[]🎛️🇯🇵 日本`[]🎛️🇰🇷 韩国`[]🎛️🇹🇼 台湾`[]🎛️🇸🇬 新加坡`[]🎛️🇺🇸 美国`[]🎛️ 指定`[]REJECT

custom_proxy_group=🧰 开发`select`[]🧰 GitHub测速`[]⚡ 自动选择`[]🛟 故障转移`[]🚀 起飞`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇨🇳 中国`[]🌐 其他`[]🎛️🇯🇵 日本`[]🎛️🇸🇬 新加坡`[]🎛️🇺🇸 美国`[]🎛️🇨🇳 中国`[]🎛️🌐 其他`[]🎛️ 指定`[]REJECT
custom_proxy_group=🍎 苹果`select`[]DIRECT`[]🏠 墙内`[]🚀 起飞`[]⚡ 自动选择
custom_proxy_group=🪟 微软`select`[]DIRECT`[]🏠 墙内`[]🚀 起飞`[]⚡ 自动选择
custom_proxy_group=❔ 未知站点`select`[]⚡ 自动选择`[]🛟 故障转移`[]🚀 起飞`[]🧰 开发`[]🤖 AI`[]🍎 苹果`[]🪟 微软`[]REJECT`[]🏠 墙内

; ─────────────────────────────────────────────────────────────
; 旧模板兼容组
; ─────────────────────────────────────────────────────────────
custom_proxy_group=✅ 全球直连`select`[]DIRECT`[]🏠 墙内`[]🚀 起飞
custom_proxy_group=⛔ 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🪟 微软服务`select`[]DIRECT`[]🪟 微软`[]🏠 墙内`[]🚀 起飞
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🍎 苹果`[]🏠 墙内`[]🚀 起飞
custom_proxy_group=🤖 AI平台`select`[]🤖 AI`[]🚀 起飞`[]✅ 全球直连
custom_proxy_group=🧩 漏网之鱼`select`[]❔ 未知站点`[]🚀 起飞`[]✅ 全球直连

; ─────────────────────────────────────────────────────────────
; 自动测速组
; interval = 后台周期测速间隔（秒），不是单次超时，不建议过小
;
; 测速 URL 说明：
;   通用出口质量 → www.google.com/generate_204   权威 204，全球 PoP 均可命中
;   YouTube 流媒体 → www.youtube.com/generate_204  主域名 204，比子域 CDN 更能反映播放链路
;   GitHub 连通性 → api.github.com                轻量 JSON 200，能真实反映 GitHub 服务端连通性
;   AI 平台连通性 → chatgpt.com/cdn-cgi/trace      Cloudflare trace，OpenAI / Claude 同在 CF 上，轻量且有代表性
; ─────────────────────────────────────────────────────────────

; 全量自动测速：顶层直接面对所有具体节点
custom_proxy_group=⚡ 自动选择`url-test`^`https://www.google.com/generate_204`300,,100
; fallback：按顺序使用第一个可用节点，比 url-test 更偏向稳定可用
custom_proxy_group=🛟 故障转移`fallback`^`https://www.google.com/generate_204`300,,100

; 按目标站点分别测速
custom_proxy_group=▶️ YouTube测速`url-test`^`https://www.youtube.com/generate_204`300,,100
custom_proxy_group=🧰 GitHub测速`url-test`^`https://api.github.com`300,,100

; AI 测速：仅允许 JP/KR/TW/SG/US 等 AI 友好出口，显式排除中国大陆 / 香港 / 澳门
; 直接对节点测速，测速 URL = chatgpt.com/cdn-cgi/trace，路径：AI → 此组 → 节点，无中间层
custom_proxy_group=🤖 AI测速`url-test`^(?!.*(🇨🇳|🇭🇰|🇲🇴|中国|大陆|内地|香港|澳门|回国)).*(🇯🇵|🇰🇷|🇹🇼|🇸🇬|🇺🇸|🇺🇲|日本|东京|大阪|Japan|韩国|首尔|Korea|台湾|台北|Taiwan|新加坡|狮城|Singapore|美国|美國|United States|USA|(^|[^A-Za-z])(JP|KR|TW|SG|US)([^A-Za-z]|$))`https://chatgpt.com/cdn-cgi/trace`300,3,100
custom_proxy_group=🛟 AI故障转移`fallback`^(?!.*(🇨🇳|🇭🇰|🇲🇴|中国|大陆|内地|香港|澳门|回国)).*(🇯🇵|🇰🇷|🇹🇼|🇸🇬|🇺🇸|🇺🇲|日本|东京|大阪|Japan|韩国|首尔|Korea|台湾|台北|Taiwan|新加坡|狮城|Singapore|美国|美國|United States|USA|(^|[^A-Za-z])(JP|KR|TW|SG|US)([^A-Za-z]|$))`https://chatgpt.com/cdn-cgi/trace`300,3,100

; 国家测速：用于手动观察各国出口质量，测速 URL 统一为 google 204（通用出口质量代表）
custom_proxy_group=🌏 国家测速`url-test`[]🇯🇵 日本`[]🇰🇷 韩国`[]🇹🇼 台湾`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇨🇳 中国`[]🌐 其他`https://www.google.com/generate_204`300,,100

; ─────────────────────────────────────────────────────────────
; 各国 url-test 组（通用出口质量，使用 google 204）
; ─────────────────────────────────────────────────────────────
custom_proxy_group=🇨🇳 中国`url-test`(🇭🇰|🇹🇼|🇨🇳|🇲🇴)(?!.*[🇦-🇿]{2})`https://www.google.com/generate_204`300,,100
custom_proxy_group=🇸🇬 新加坡`url-test`🇸🇬(?!.*[🇦-🇿]{2})`https://www.google.com/generate_204`300,,100
custom_proxy_group=🇯🇵 日本`url-test`🇯🇵(?!.*[🇦-🇿]{2})`https://www.google.com/generate_204`300,,100
custom_proxy_group=🇰🇷 韩国`url-test`🇰🇷(?!.*[🇦-🇿]{2})`https://www.google.com/generate_204`300,,100
custom_proxy_group=🇹🇼 台湾`url-test`🇹🇼(?!.*[🇦-🇿]{2})`https://www.google.com/generate_204`300,,100
custom_proxy_group=🇺🇸 美国`url-test`(🇺🇸|🇺🇲)(?!.*[🇦-🇿]{2})`https://www.google.com/generate_204`300,,300
custom_proxy_group=🌐 其他`url-test`^(?!.*(🇨🇳|🇭🇰|🇲🇴|🇹🇼|🇰🇷|🇸🇬|🇯🇵|🇺🇸|🇺🇲)(?!.*[🇦-🇿]{2}))`https://www.google.com/generate_204`300,,100

; ─────────────────────────────────────────────────────────────
; 各国手动精选组
; ─────────────────────────────────────────────────────────────
custom_proxy_group=🎛️🇨🇳 中国`select`(🇭🇰|🇹🇼|🇨🇳|🇲🇴)(?!.*[🇦-🇿]{2})
custom_proxy_group=🎛️🇸🇬 新加坡`select`🇸🇬(?!.*[🇦-🇿]{2})
custom_proxy_group=🎛️🇯🇵 日本`select`🇯🇵(?!.*[🇦-🇿]{2})
custom_proxy_group=🎛️🇰🇷 韩国`select`🇰🇷(?!.*[🇦-🇿]{2})
custom_proxy_group=🎛️🇹🇼 台湾`select`🇹🇼(?!.*[🇦-🇿]{2})
custom_proxy_group=🎛️🇺🇸 美国`select`(🇺🇸|🇺🇲)(?!.*[🇦-🇿]{2})
custom_proxy_group=🎛️🌐 其他`select`^(?!.*(🇨🇳|🇭🇰|🇲🇴|🇹🇼|🇰🇷|🇸🇬|🇯🇵|🇺🇸|🇺🇲)(?!.*[🇦-🇿]{2}))

enable_rule_generator=true
overwrite_original_rules=true

; ─────────────────────────────────────────────────────────────
; 规则集
; ─────────────────────────────────────────────────────────────

; 局域网和本地网络始终直连
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=✅ 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

; ===== 本机 / 局域网 / 公司内网 / 裸 IP 强制直连 =====
; 这些规则必须使用 DIRECT, 不使用可切换策略组, 避免内网流量被误切到代理
ruleset=DIRECT,[]DOMAIN,localhost
ruleset=DIRECT,[]DOMAIN-SUFFIX,localhost
ruleset=DIRECT,[]DOMAIN-SUFFIX,local
ruleset=DIRECT,[]DOMAIN-SUFFIX,lan
ruleset=DIRECT,[]DOMAIN-SUFFIX,home.arpa

; IPv4 本机 / 私有地址 / 链路本地 / CGNAT
ruleset=DIRECT,[]IP-CIDR,0.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,100.64.0.0/10,no-resolve
ruleset=DIRECT,[]IP-CIDR,127.0.0.0/8,no-resolve
