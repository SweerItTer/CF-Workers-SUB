ruleset=💜 B站,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Bilibili.list


; 通用海外代理规则：进入「🛫 起飞」
; 说明：Telegram / 海外媒体 / ProxyLite / GFWlist 统一进入主代理入口。
ruleset=🛫 起飞,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🛫 起飞,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🛫 起飞,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🛫 起飞,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list


; 中国域名 / 中国企业 IP / 中国 GEOIP：最后收口到「🏡 墙内」
; 说明：域名没进规则库时，只要解析后的 IP 属于 CN，也会进入墙内组。
; 注意：这里不写 DIRECT，是为了保留你手动切香港 / 台湾加速国内业务的能力。
ruleset=🏡 墙内,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🏡 墙内,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🏡 墙内,[]GEOIP,CN


; FINAL 兜底：所有未命中的流量
; 说明：默认代理优先；如果发现某个国内站误进这里，再按域名补规则或检查 DNS/GeoIP。
ruleset=🐟 漏网之鱼,[]FINAL
