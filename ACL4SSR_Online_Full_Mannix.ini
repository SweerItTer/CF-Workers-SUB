[custom]
; 干净去重版规则模板
; 目标：墙外尽量代理，墙内/中国业务尽量直连，同时保留手动切港/台加速的空间。
;
; 设计原则：
; 1. 不再保留「全球直连」这类和「墙内」重复的同义组。
; 2. 地区只保留一套 url-test 组；手动点选具体节点统一走「🎯 指定」。
; 3. AI 只保留「AI测速」，删除重复的「AI故障转移」。
; 4. 删除「未知站点」中转层，FINAL 直接进入「🐟 漏网之鱼」。
; 5. CN GEOIP 不强制 DIRECT，而是进入「🏡 墙内」，便于你在直连慢时手动切港/台。

; 过滤订阅里流量/到期/套餐说明节点，避免它们出现在节点列表。
exclude_remarks=(Data Left|Remain:|Traffic:|Expir[ey]|Reset|(\d[\d.]*\s*[MG]B[^\dA-Za-z]+|[:：]\s*)\d[\d.]*\s*GB(?![\dA-Za-z])|剩[余餘]流量|流量：|[到过過效]期|[时時][间間]|重置|分割线|残り使用容量|残りデータ通信量|有効期限|リセット|🔰 (ID|HSD|SNI):|📝 Gói:)

; 节点名称自动补 emoji；保留订阅原有 emoji。
add_emoji=true
remove_old_emoji=false
;启用规则生成器
enable_rule_generator=true
;是否覆写之前配置的基础配置内容
overwrite_original_rules=true

; ─────────────────────────────────────────────────────────────
; 策略组：入口层
; ─────────────────────────────────────────────────────────────

; 主代理入口：通用海外流量默认走这里。
; 只放常用选择，避免主入口过长、重复、难维护。
custom_proxy_group=🛫 起飞`select`[]✨ 自动选择`[]🛡️ 故障转移`[]🎬 YouTube测速`[]🐙 GitHub测速`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇸🇬 新加坡`[]🇯🇵 日本`[]🇰🇷 韩国`[]🇺🇸 美国`[]🌐 其他`[]🎯 指定`[]REJECT

; 手动指定：列出所有具体节点。
; 杂牌节点、识别不出地区的节点，也能在这里找到。
custom_proxy_group=🎯 指定`select`^

; 墙内：国内 / 中国业务入口。
; 默认 DIRECT；若校园网/运营商出口绕路，可手动切香港/台湾或主代理入口。
custom_proxy_group=🏡 墙内`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🛫 起飞`[]REJECT

; 广告：默认拒绝；必要时可临时切 DIRECT 排查误杀。
custom_proxy_group=🚫 广告`select`[]REJECT`[]DIRECT

; B站：默认走墙内；港澳台内容可以手动切港/台。
custom_proxy_group=💜 B站`select`[]🏡 墙内`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🛫 起飞`[]🎯 指定`[]REJECT

; AI：AI 服务专用入口。
; 默认用 AI测速；地区备选只放 AI 相对友好的 JP/KR/TW/SG/US。
custom_proxy_group=🧠 AI`select`[]🧠 AI测速`[]🇯🇵 日本`[]🇰🇷 韩国`[]🇹🇼 台湾`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🎯 指定`[]REJECT

; 开发：GitHub / 包管理器 / 云开发平台专用入口。
custom_proxy_group=💻 开发`select`[]🐙 GitHub测速`[]✨ 自动选择`[]🛡️ 故障转移`[]🛫 起飞`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🌐 其他`[]🎯 指定`[]REJECT

; 苹果 / 微软：默认直连，但保留切代理能力。
custom_proxy_group=🍏 苹果`select`[]DIRECT`[]🏡 墙内`[]🛫 起飞`[]✨ 自动选择`[]REJECT
custom_proxy_group=💠 微软`select`[]DIRECT`[]🏡 墙内`[]🛫 起飞`[]✨ 自动选择`[]REJECT

; 漏网之鱼：FINAL 兜底。
; 删除「未知站点」中转层，减少一次无意义跳转。
custom_proxy_group=🐟 漏网之鱼`select`[]✨ 自动选择`[]🛡️ 故障转移`[]🛫 起飞`[]💻 开发`[]🧠 AI`[]🏡 墙内`[]🎯 指定`[]REJECT

; ─────────────────────────────────────────────────────────────
; 自动测速组
; ─────────────────────────────────────────────────────────────

; 全节点自动测速：适合作为通用默认出口。
custom_proxy_group=✨ 自动选择`url-test`^`https://www.google.com/generate_204`300,,100

; 全节点故障转移：按节点顺序选第一个可用节点，更偏稳定兜底。
custom_proxy_group=🛡️ 故障转移`fallback`^`https://www.google.com/generate_204`300,,100

; 站点专项测速：用于手动观察对应服务体验。
custom_proxy_group=🎬 YouTube测速`url-test`^`https://www.youtube.com/generate_204`300,,100
custom_proxy_group=🐙 GitHub测速`url-test`^`https://api.github.com`300,,100

; AI 专项测速：排除中国大陆 / 香港 / 澳门，避免 AI 走到不友好的出口。
; 这里不再保留 AI fallback，因为它和 AI测速高度重复。
custom_proxy_group=🧠 AI测速`url-test`^(?!.*(🇨🇳|🇭🇰|🇲🇴|中国|大陆|内地|香港|澳门|回国)).*(🇯🇵|🇰🇷|🇹🇼|🇸🇬|🇺🇸|🇺🇲|日本|东京|大阪|Japan|韩国|首尔|Korea|台湾|台北|Taiwan|新加坡|狮城|Singapore|美国|美國|United States|USA|(^|[^A-Za-z])(JP|KR|TW|SG|US)([^A-Za-z]|$))`https://chatgpt.com/cdn-cgi/trace`300,3,100

; ─────────────────────────────────────────────────────────────
; 地区组：只保留一套 url-test
; ─────────────────────────────────────────────────────────────
; 说明：地区判断依赖节点名称，不检查节点真实 IP 地区。
; 杂牌/无法识别地区的节点会进入「🌐 其他」，同时也会出现在「✨ 自动选择」和「🎯 指定」。

custom_proxy_group=🇭🇰 香港`url-test`(🇭🇰|香港|Hong Kong|(^|[^A-Za-z])HK([^A-Za-z]|$))`https://www.google.com/generate_204`300,,100
custom_proxy_group=🇹🇼 台湾`url-test`(🇹🇼|台湾|台灣|Taiwan|(^|[^A-Za-z])TW([^A-Za-z]|$))`https://www.google.com/generate_204`300,,100
custom_proxy_group=🇸🇬 新加坡`url-test`(🇸🇬|新加坡|狮城|Singapore|(^|[^A-Za-z])SG([^A-Za-z]|$))`https://www.google.com/generate_204`300,,100
custom_proxy_group=🇯🇵 日本`url-test`(🇯🇵|日本|东京|大阪|Japan|Tokyo|Osaka|(^|[^A-Za-z])JP([^A-Za-z]|$))`https://www.google.com/generate_204`300,,100
custom_proxy_group=🇰🇷 韩国`url-test`(🇰🇷|韩国|韓國|首尔|首爾|Korea|Seoul|(^|[^A-Za-z])KR([^A-Za-z]|$))`https://www.google.com/generate_204`300,,100
custom_proxy_group=🇺🇸 美国`url-test`(🇺🇸|🇺🇲|美国|美國|United States|USA|(^|[^A-Za-z])US([^A-Za-z]|$))`https://www.google.com/generate_204`300,,300
custom_proxy_group=🌐 其他`url-test`^(?!.*(🇭🇰|🇲🇴|🇹🇼|🇰🇷|🇸🇬|🇯🇵|🇺🇸|🇺🇲|香港|澳门|澳門|台湾|台灣|韩国|韓國|新加坡|日本|美国|美國|Hong Kong|Taiwan|Korea|Singapore|Japan|United States|USA|(^|[^A-Za-z])(HK|MO|TW|KR|SG|JP|US)([^A-Za-z]|$)))`https://www.google.com/generate_204`300,,100

; ─────────────────────────────────────────────────────────────
; 规则生成开关
; ─────────────────────────────────────────────────────────────

enable_rule_generator=true
overwrite_original_rules=true

; ─────────────────────────────────────────────────────────────
; 规则集
; ─────────────────────────────────────────────────────────────

; ─────────────────────────────────────────────────────────────
; 本机 / 局域网 / 私有地址：强制 DIRECT
; 说明：这些流量不应该进入任何策略组，避免内网资源被代理。
; no-resolve 表示纯 IP 段匹配时不额外触发 DNS 解析。
; ─────────────────────────────────────────────────────────────
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=DIRECT,[]DOMAIN,localhost
ruleset=DIRECT,[]DOMAIN-SUFFIX,localhost
ruleset=DIRECT,[]DOMAIN-SUFFIX,local
ruleset=DIRECT,[]DOMAIN-SUFFIX,lan
ruleset=DIRECT,[]DOMAIN-SUFFIX,home.arpa
ruleset=DIRECT,[]IP-CIDR,0.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,100.64.0.0/10,no-resolve
ruleset=DIRECT,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,169.254.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.0.0.0/24,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.0.2.0/24,no-resolve
ruleset=DIRECT,[]IP-CIDR,198.51.100.0/24,no-resolve
ruleset=DIRECT,[]IP-CIDR,203.0.113.0/24,no-resolve
ruleset=DIRECT,[]IP-CIDR,224.0.0.0/4,no-resolve
ruleset=DIRECT,[]IP-CIDR,240.0.0.0/4,no-resolve
ruleset=DIRECT,[]IP-CIDR,255.255.255.255/32,no-resolve
ruleset=DIRECT,[]IP-CIDR6,::1/128,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fc00::/7,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fe80::/10,no-resolve
ruleset=DIRECT,[]IP-CIDR6,ff00::/8,no-resolve


; 苹果 / 微软：单独分组
; 说明：这两类服务同时存在海外与中国区业务，默认直连，但保留手动切代理能力。
ruleset=🍏 苹果,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Apple.list
ruleset=💠 微软,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Microsoft.list


